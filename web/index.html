<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy GM</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: oklch(97.4% 0.004 260);
  --panel: oklch(100% 0 0);
  --panel-2: oklch(98.6% 0.003 260);
  --line: oklch(91.5% 0.006 260);
  --line-strong: oklch(85% 0.008 260);
  --text: oklch(23% 0.016 260);
  --muted: oklch(49% 0.016 260);
  --faint: oklch(62% 0.012 260);
  --accent: oklch(51% 0.19 268);
  --accent-hover: oklch(46% 0.19 268);
  --accent-soft: oklch(95.5% 0.028 268);
  --accent-ink: oklch(40% 0.17 268);
  --pos: oklch(66% 0.15 152);
  --neg: oklch(63% 0.19 24);
  --pos-ink: oklch(42% 0.12 152);
  --neg-ink: oklch(47% 0.17 24);
  --warn-soft: oklch(95% 0.05 85);
  --warn-ink: oklch(45% 0.1 70);
  --shadow: 0 1px 2px oklch(30% 0.02 260 / 0.06), 0 4px 12px oklch(30% 0.02 260 / 0.05);
  --radius: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: oklch(17.5% 0.008 260);
    --panel: oklch(21% 0.009 260);
    --panel-2: oklch(23.5% 0.01 260);
    --line: oklch(29% 0.01 260);
    --line-strong: oklch(36% 0.012 260);
    --text: oklch(93% 0.006 260);
    --muted: oklch(72% 0.012 260);
    --faint: oklch(60% 0.012 260);
    --accent: oklch(66% 0.17 268);
    --accent-hover: oklch(72% 0.15 268);
    --accent-soft: oklch(30% 0.06 268);
    --accent-ink: oklch(82% 0.1 268);
    --pos: oklch(62% 0.14 152);
    --neg: oklch(60% 0.17 24);
    --pos-ink: oklch(80% 0.12 152);
    --neg-ink: oklch(78% 0.13 24);
    --warn-soft: oklch(30% 0.05 80);
    --warn-ink: oklch(85% 0.09 80);
    --shadow: 0 1px 2px oklch(0% 0 0 / 0.3), 0 6px 16px oklch(0% 0 0 / 0.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-soft); color: var(--accent-ink); }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-ink); text-underline-offset: 3px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* shell */
.app { display: grid; grid-template-columns: 216px 1fr; min-height: 100%; }
.side { background: var(--panel-2); border-right: 1px solid var(--line); padding: 16px 10px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 10px 18px; font-weight: 650; font-size: 15px; }
.brand-mark { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: white; display: grid; place-items: center; }
.brand-mark svg { width: 15px; height: 15px; stroke-width: 2; }
.nav { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; border: 0; background: none; text-align: left; color: var(--muted); cursor: pointer; font-weight: 500; transition: background .15s, color .15s; }
.nav:hover { background: var(--line); color: var(--text); }
.nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
.side-foot { margin-top: auto; padding: 10px; color: var(--faint); font-size: 12px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in oklch, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 10px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.league { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.league b { font-size: 15px; font-weight: 650; white-space: nowrap; }
.league span { color: var(--muted); font-size: 12px; }
select.me { field-sizing: content; border: 0; background: none; padding: 0 2px; font-size: 12px; color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.punts { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.punts > span { color: var(--muted); font-size: 12px; margin-right: 4px; }
.top-find { width: 220px; }
.chip { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 550; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
.chip:hover { border-color: var(--faint); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 6px; padding: 6px 12px; font-weight: 550; cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap; }
.btn:hover { background: var(--panel-2); border-color: var(--faint); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--line); }
.btn svg { width: 15px; height: 15px; }
.btn.busy svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.content { padding: 24px; display: flex; flex-direction: column; gap: 20px; max-width: 1360px; width: 100%; }
.content > *, .grid2 > * { min-width: 0; }
h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 650; margin: 0; }
.sub { color: var(--muted); margin: 4px 0 0; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel-h p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.panel-b { padding: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.notice { padding: 9px 14px; border-radius: var(--radius); background: var(--warn-soft); color: var(--warn-ink); font-size: 13px; }
.notice code { font-size: 12px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

/* category strip */
.cats { display: grid; grid-template-columns: repeat(var(--n, 9), minmax(0, 1fr)); }
.cat { padding: 12px 10px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; transition: opacity .2s; }
.cat:last-child { border-right: 0; }
.cat .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
.cat .rk { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
.cat .rk small { font-size: 12px; color: var(--faint); font-weight: 500; }
.cat .tot { font-size: 12px; }
.bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 2px; }
.cat.punted { opacity: .38; }
.cat.punted .lbl { text-decoration: line-through; }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel); position: sticky; top: 0; }
th.n, td.n { text-align: right; }
td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
table.wrap td:first-child { white-space: normal; }
tbody tr { transition: background .12s; }
tbody tr:hover { background: var(--panel-2); }
td.z { text-align: center; font-size: 12.5px; min-width: 50px; position: relative; transition: opacity .2s, filter .2s; }
td.z::before { content: ""; position: absolute; inset: 2px; border-radius: 4px; background: var(--c, transparent); z-index: 0; }
td.z span { position: relative; }
.punted-col { opacity: .3; filter: grayscale(1); }
th.punted-col, tr.punted-col td:first-child { text-decoration: line-through; }
.flags { margin: 0; padding: 12px 16px 12px 34px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.pname { font-weight: 550; }
.tag { display: inline-block; font-size: 11px; font-weight: 650; padding: 0 5px; border-radius: 4px; background: var(--line); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
.tag.out { background: color-mix(in oklch, var(--neg) 18%, transparent); color: var(--neg-ink); }
.tag.safe { background: color-mix(in oklch, var(--pos) 20%, transparent); color: var(--pos-ink); }
.tag.chase { color: var(--text); }
.val { font-weight: 650; }
.pos { color: var(--pos-ink); }
.neg { color: var(--neg-ink); }
.rowbtn { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; font-weight: 550; }
.rowbtn:hover { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; }
.rowbtn[aria-pressed="true"] { color: var(--accent-ink); }
tr.sel td { background: var(--accent-soft); }
tr.has-sub td:not([rowspan]), tr.has-sub:nth-last-child(2) td { border-bottom: 0; }
tr.sub td { padding-top: 0; }
.rowbtn[aria-expanded="true"] { color: var(--accent-ink); }
/* player card: a recessed row under the name, pinned to the visible part of a sideways-scrolling table (100cqi) */
.tw:has(.card-row) { container-type: inline-size; }
tbody tr.card-row, tbody tr.card-row:hover { background: var(--panel-2); }
tr.card-row > td { padding: 0; white-space: normal; }
.pcard { position: sticky; left: 0; max-width: min(860px, 100cqi); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.pcard-h { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.pcard .tw { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.pcard th { position: static; }
.pcard .sep { border-left: 1px solid var(--line); padding-left: 24px; }
.card-panel .pcard { position: static; max-width: none; }  /* the top bar's search: a name on no table on screen */
.news { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; max-width: 72ch; }
h3.small { margin: 0; font-weight: 650; }
details > summary { cursor: pointer; margin-top: 10px; color: var(--muted); }

/* matchups */
.vs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0; }
.vs-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.vs-row .rec { font-weight: 650; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 7px; vertical-align: 1px; }

/* trade */
.picker { display: flex; flex-direction: column; gap: 10px; }
.plist { display: flex; flex-direction: column; max-height: 360px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.pitem { display: grid; grid-template-columns: 18px 1fr auto auto; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.pitem:last-child { border-bottom: 0; }
.pitem:hover { background: var(--panel-2); }
.pitem input { accent-color: var(--accent); margin: 0; }
.pitem.on { background: var(--accent-soft); }
select, .input { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 6px; padding: 6px 10px; }
.input::placeholder { color: var(--faint); }
.lock { border: 0; background: none; padding: 5px; margin: -5px -4px -5px 0; border-radius: 4px; color: var(--faint); opacity: .5; cursor: pointer; display: grid; transition: opacity .15s, color .15s; }
.lock svg { width: 15px; height: 15px; }
.lock:hover { opacity: 1; }
.lock[aria-pressed="true"] { opacity: 1; color: var(--text); }
.field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; font-weight: 550; }
.field input { accent-color: var(--accent); margin: 0; }
.chip.pick[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); text-decoration: none; }
.sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
.sort:hover { color: var(--text); }
.sort svg { width: 12px; height: 12px; }
.sort svg.up { transform: rotate(180deg); }
svg.trend { width: 13px; height: 13px; stroke-width: 2.2; vertical-align: -2px; margin-right: 3px; }
svg.trend.down { transform: rotate(180deg); }
td.names { white-space: normal; min-width: 130px; }
td.why { white-space: normal; min-width: 240px; }
.deals { max-height: 456px; overflow: auto; border-radius: 0 0 var(--radius) var(--radius); }  /* ~10 deals; headers stay sticky */
.compare th, .compare td { white-space: normal; min-width: 150px; vertical-align: top; }
.compare th:first-child, .compare td:first-child { min-width: 0; white-space: nowrap; color: var(--muted); font-size: 12px; font-weight: 600; }
.cmp td.z { min-width: 150px; }
.cmp b { font-weight: 700; }
.cmp th { vertical-align: top; }
.btn.cmp-x { margin: 4px 0 0 -8px; padding: 2px 8px; font-size: 12px; }
/* schedule planner: a calendar of your players with games per day, filled by count minus starting spots */
.cal th.d { text-align: center; }
.cal td.day { min-width: 48px; padding: 3px 2px; }
.cal td.lbl { white-space: nowrap; }
.cal tbody tr:hover { background: none; }
.daybtn { position: relative; width: 100%; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; padding: 4px 0; border-radius: 4px; display: flex; flex-direction: column; align-items: center; }
.daybtn b { font-size: 15px; font-weight: 650; line-height: 1.2; }
.daybtn small { font-size: 11px; color: var(--muted); }
.daybtn:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
.daybtn[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
tr.cmp-group td, tr.cmp-group:hover td { background: var(--panel-2); color: var(--muted); font-size: 12px; font-weight: 600; padding: 6px 10px; }
.verdict { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.big { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.pill { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-weight: 650; font-size: 12.5px; text-transform: capitalize; }
.pill.accept { background: color-mix(in oklch, var(--pos) 20%, transparent); color: var(--pos-ink); }
.pill.decline { background: color-mix(in oklch, var(--neg) 18%, transparent); color: var(--neg-ink); }
.pill.toss-up { background: var(--line); color: var(--muted); }
.side-by { display: flex; flex-wrap: wrap; gap: 10px 24px; margin: 0; }
.side-by dt { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.side-by dd { margin: 0; font-weight: 650; font-size: 16px; white-space: nowrap; }
.pill { white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 6px 12px; cursor: pointer; font-weight: 550; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* chat */
.chat { display: grid; grid-template-rows: 1fr auto; height: calc(100vh - 170px); min-height: 420px; }
.hist { display: flex; flex-direction: column; height: calc(100vh - 170px); min-height: 420px; }
.hist-list { overflow: auto; }
.hist-list button { display: flex; flex-direction: column; gap: 1px; width: 100%; min-width: 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; padding: 8px 14px; cursor: pointer; transition: background .12s; }
.hist-list button:hover { background: var(--panel-2); }
.hist-list button[aria-current="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.hist-list button:disabled { cursor: not-allowed; }
.hist-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
.msgs { overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 76ch; white-space: pre-wrap; line-height: 1.55; }
.msg.user { align-self: flex-end; background: var(--accent-soft); color: var(--accent-ink); padding: 8px 13px; border-radius: 12px 12px 4px 12px; }
.msg.ai { align-self: flex-start; }
.msg.ai.thinking { color: var(--muted); }
.compose { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.compose form { display: flex; gap: 8px; }
.compose textarea { flex: 1; resize: none; border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 12px; background: var(--panel); min-height: 42px; max-height: 160px; }
.compose textarea::placeholder { color: var(--faint); }
.sugs { display: flex; gap: 6px; flex-wrap: wrap; }

/* states */
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--text); margin-bottom: 4px; }
.skel { height: 14px; border-radius: 4px; background: var(--line); margin: 12px 16px; animation: pulse 1.2s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: .45; } to { opacity: 1; } }
.err { padding: 14px 16px; color: var(--neg-ink); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); z-index: 20; }

@media (max-width: 980px) {
  .grid2 { grid-template-columns: 1fr; }
  .cats { grid-template-columns: repeat(5, 1fr); }
  .cat:nth-child(5) { border-right: 0; }
}
@media (max-width: 760px) {
  .cal td.day { min-width: 38px; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand, .side-foot { display: none; }
  .nav span { white-space: nowrap; }
  .top, .content { padding-left: 16px; padding-right: 16px; }
  .punts { margin-left: 0; width: 100%; }
  .top-find { flex: 1 1 140px; width: auto; }
  .grid2[style] { grid-template-columns: 1fr !important; }
  .chat { height: calc(100vh - 120px); }
  .hist { height: auto; min-height: 0; max-height: 210px; }
  .cats { grid-template-columns: repeat(3, 1fr); }
  .pcard .sep { border-left: 0; padding-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("gm." + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("gm." + k, JSON.stringify(v)); } catch {} },
};
const [hashView, hashQuery] = location.hash.slice(1).split("?");
const link = new URLSearchParams(hashQuery);  // #trades?give=A,B&get=C opens and evaluates a trade
const S = {
  view: hashView || store.get("view", "team"),
  punt: new URLSearchParams(location.search).get("punt")?.split(",").filter(Boolean) ?? store.get("punt", []),  // ?punt=FT%25,TOV bookmarks a build
  state: null, error: null,
  league: { team: null, data: null },
  week: {},  // { data, loading }; replaced on punt / team / refresh, so late answers land in the old object
  sched: {},  // { data, loading }: the schedule planner; replaced on punt / team / refresh
  plan: { sort: null, open: false, day: null },  // its NBA-teams table: sort, count only your open days; the picked day
  news: {},  // { data, error }: My team's News panel; replaced on team / refresh
  strategy: {},  // { data, busy, sel }: the punt planner (sel: the build whose plan shows), ignores your punt, so only team / refresh replace it
  trade: { give: new Set(), get: new Set(), team: null, roster: null, result: null, busy: false },
  locks: new Set(store.get("locks", [])),
  find: { tier: "fair", goal: "win", cats: [], vs: "", size: 3, healthy: false, theirs: store.get("theirs", false), shape: "", overpay: "", team: "", list: null, busy: false, ran: "", sort: null },
  improve: { kind: null, list: null, busy: false, sort: null },
  saved: { list: store.get("saved", []), evals: {}, loading: false },
  players: null,
  card: {},  // { name, t, data, error }: the open player card, under that name in the t-th player table of the view
  move: { add: "", drop: "", result: null, busy: false },  // Waivers' add/drop evaluator (Q7); result is dropped on punt / team / refresh
  compare: { names: store.get("compare", []), line: "ros" },  // + data, busy, error; data is dropped on punt / team / refresh
  pool: null,  // every rostered player and free agent, for Compare's search
  chat: store.get("chat", []), chatBusy: false, chatSession: store.get("chatSession", null),
  chatId: store.get("chatId", null), chats: null,  // the open conversation's id in data/chats.json, and the History list
  gmSet: { model: "claude-opus-5-5", effort: "medium", web: true, ...store.get("gmSet", {}) },  // AI GM tab's Model / Effort / Web search
};
const OUT = new Set(["O", "INJ", "IL", "IL+", "NA", "SUSP"]);

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, punt: S.punt }) } : undefined);
  const data = await r.json().catch(() => ({ error: `Server returned ${r.status}` }));
  if (!r.ok || data.error) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), 3200);
}
function reveal(sel) {  // scroll to a panel (a selector or the element), clear of the sticky top bar (taller on phones)
  const el = typeof sel === "string" ? $(sel) : sel;
  if (el) window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - $(".top").offsetHeight - 12, behavior: "smooth" });
}

async function loadState() {
  try {
    S.state = await api("/api/state?punt=" + encodeURIComponent(S.punt.join(",")));
    S.error = null;
  } catch (e) { S.error = e.message; }
  render();
}

// ---------- formatting ----------
const isPoints = () => S.state?.mode === "points";
const oneWin = () => S.state?.scoring === "one_win";
// 9-cat's headline number: share of categories won (categories leagues, where each one counts in the standings) or the chance to win the week
const WIN = () => oneWin() ? { h: "Win odds", of: "weekly win odds", def: "chance to win a typical week vs the league" }
  : { h: "Win %", of: "win %", def: "share of categories you'd win in a typical week vs the league, the way the standings count them" };
const cap = s => s[0].toUpperCase() + s.slice(1);
const sign = v => (v > 0 ? "+" : "") + Number(v).toFixed(2);
const sign1 = v => (v > 0 ? "+" : "") + Number(v).toFixed(1);
const pct = v => Math.round(v * 100) + "%";
const delta = (v, unit) => unit === "win%" ? sign1(v) + "%" : sign(v);  // win% deltas are percentage points
const and = xs => xs.length > 1 ? xs.slice(0, -1).join(", ") + " and " + xs.at(-1) : xs.join("");
// waiver moves that need no trade (trades are scored on top of them): "Vučević for Achiuwa (+1.2%)"
const freeList = (ms, more = 0) => and([...ms.map(m => `${esc(m.add)} ${m.drop ? "for " + esc(m.drop) : "into the open spot"} (${delta(m.gain, "win%")})`),
  ...(more > 0 ? [`${more} more`] : [])]);
const ord = n => n + (n % 10 === 1 && n % 100 !== 11 ? "st" : n % 10 === 2 && n % 100 !== 12 ? "nd" : n % 10 === 3 && n % 100 !== 13 ? "rd" : "th");
const when = iso => new Date(iso).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const oddsColor = v => v > 0.6 ? "var(--pos)" : v < 0.35 ? "var(--neg)" : "var(--faint)";
const tone = v => v > 0.05 ? "pos" : v < -0.05 ? "neg" : "";
function heat(v) {
  const a = Math.min(Math.abs(v) / 2.5, 1) * 0.5;
  const c = v >= 0 ? "var(--pos)" : "var(--neg)";
  return `color-mix(in oklch, ${c} ${Math.round(a * 100)}%, transparent)`;
}
const punted = c => S.punt.includes(c);
const LABEL = { FG3M: "3PM", TOV: "TO" };
const lab = c => LABEL[c] || c;
const mdy = d => new Date(d + "T12:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
const statusTag = p => p.status || p.injury ? `<span class="tag ${OUT.has(p.status) ? "out" : ""}"${p.injury ? ` title="${esc(p.injury)}"` : ""}>${esc(p.status || "News")}${p.return && p.return >= new Date().toISOString().slice(0, 10) ? ` · back ${mdy(p.return)}` : ""}</span>` : "";
const gpNote = p => p.gp < 3 ? ` title="Only ${p.gp} games this season"` : "";
// teammates' injuries: the minutes and shots he picks up while they sit, counted in his lines for those games only.
// Tables tag a lift of a minute or more (most are smaller, spread over a whole rotation); the card lists every one
const liftMin = p => (p.lift || []).reduce((s, l) => s + l.MIN, 0);
const liftWhen = l => `${esc(l.by)} is out (back ${mdy(l.return)}, ${l.games} game${l.games === 1 ? "" : "s"})`;
const liftTag = p => liftMin(p) >= 1 ? `<span class="tag" title="${p.lift.map(l => `+${l.MIN.toFixed(1)} min a game while ${liftWhen(l)}`).join("; ")}. Counted in his lines for those games">+${liftMin(p).toFixed(1)} min</span>` : "";
// recent form: his value over the last 14 days (this season without box scores). The model arrows it when it's far
// (about one 14-day standard deviation) from his rest-of-season value
const formWin = () => S.state.movers?.window || "the last 14 days";
const formNote = p => p.form == null ? "" : `${cap(formWin().replace(/^the /, ""))}: ${Number(p.form).toFixed(isPoints() ? 1 : 2)} over ${p.form_gp} games (${sign(p.form - p.value)} on his rest-of-season value)`;
const trendTag = p => p.trend ? `<svg class="i trend ${p.trend} ${p.trend === "up" ? "pos" : "neg"}" role="img" aria-label="Running ${p.trend === "up" ? "hot" : "cold"}"><use href="#i-arrow"/></svg>` : "";
// trade market (Yahoo ranks): a player's value + rank (* = Yahoo hasn't ranked him, the model's rank), a deal's gap
const mktCell = p => `${Math.round(p.mkt)} <span class="muted small"${p.mkt_model ? ` title="Yahoo hasn't ranked him: the model's own rank"` : ""}>#${p.mkt_rank}${p.mkt_model ? "*" : ""}</span>`;
const mktTone = d => Math.abs(d) < 5 ? "" : tone(d);
const mktDeal = m => `<span class="muted small">${Math.round(m.give)} → ${Math.round(m.get)}</span> <span class="${mktTone(m.diff_pct)}">${(m.diff_pct > 0 ? "+" : "") + Math.round(m.diff_pct)}%</span>`;
const MKT_TIP = "Market value you send → get (100 = the market's top player, from Yahoo's preseason and current ranks), roster spots included. % = what you gain on market, as a share of the bigger side";

let TBL = 0;  // player tables drawn so far in this render: S.card.t says which one holds the open card
function playerTable(players, { extra = [], empty = "No players.", dim = [] } = {}) {  // dim: grey these columns too (a build's punt); an extra's cls replaces the numeric "n" (text columns)
  const t = TBL++;
  if (!players?.length) return `<div class="empty">${empty}</div>`;
  const cats = S.state.cats, punted = c => S.punt.includes(c) || dim.includes(c);
  const wk = players.some(p => p.games !== undefined), cols = 6 + extra.length + wk + (isPoints() ? 1 : cats.length);
  const head = `<tr><th>Player</th>${extra.map(x => `<th class="${x.cls ? "" : "n"}">${x.h}</th>`).join("")}${wk ? `<th class="n" title="Games left this week (Monday to Sunday), after any return date">Wk</th>` : ""}<th class="n">GP</th>
    <th class="n" title="Expected share of remaining games played (games-played history + Yahoo injury status)">Plays</th>
    <th class="n" title="Rest-of-season value on your build. An arrow: he's run well above or below it over ${formWin()}">Value</th><th class="n" title="How this season looks so far (what Yahoo ranks show)">Now</th>
    <th class="n" title="Trade-market value (100 = the market's top player) and market rank: Yahoo's preseason rank blended with this season's, weighted by games played">Mkt</th>
    ${isPoints() ? `<th class="n">FP/G</th>` : cats.map(c => `<th class="n z ${punted(c) ? "punted-col" : ""}" style="text-align:center">${lab(c)}</th>`).join("")}</tr>`;
  const rows = players.map(p => { const open = S.card.t === t && S.card.name === p.name; return `<tr${open ? ` class="sel"` : ""}>
    <td><button class="rowbtn" data-act="card" data-name="${esc(p.name)}" data-t="${t}" aria-expanded="${open}" title="${open ? "Close" : "Open"} his player card">${esc(p.name)}</button>${statusTag(p)}${liftTag(p)}${p.pos ? ` <span class="muted small">${esc(p.pos)}</span>` : ""}</td>
    ${extra.map(x => `<td class="${x.cls ?? "n"}">${x.v(p)}</td>`).join("")}
    ${wk ? `<td class="n ${p.games >= 4 ? "pos" : p.games <= 1 ? "neg" : ""}">${p.games ?? ""}</td>` : ""}
    <td class="n muted"${gpNote(p)}>${p.gp}</td>
    <td class="n ${p.avail < 0.6 ? "neg" : "muted"}">${pct(p.avail)}</td>
    <td class="n val"${p.form == null ? "" : ` title="${formNote(p)}"`}>${trendTag(p)}${Number(p.value).toFixed(isPoints() ? 1 : 2)}</td>
    <td class="n ${tone(p.value_now - p.value)}">${Number(p.value_now).toFixed(isPoints() ? 1 : 2)}</td>
    <td class="n">${p.mkt == null ? "" : mktCell(p)}</td>
    ${isPoints() ? `<td class="n">${p.fp.toFixed(1)}</td>` : cats.map(c => `<td class="z ${punted(c) ? "punted-col" : ""}" style="--c:${heat(p.z[c])}"><span>${p.z[c].toFixed(1)}</span></td>`).join("")}
  </tr>${open ? `<tr class="card-row"><td colspan="${cols}">${playerCard()}</td></tr>` : ""}`; }).join("");
  return `<div class="tw"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}

// ---------- player card: click a name in any player table ----------
const LINES = { ros: ["Rest of season", "The model's projection: expert projections and the last two seasons, blended with this one"],
  yahoo: ["Yahoo projection", "Yahoo's rest-of-season projection from the snapshot, part of ours. Yahoo shows no minutes"],
  espn: ["ESPN projection", "ESPN's season projection, part of ours (Yahoo's snapshot doesn't list him)"],
  season: ["This season"], last30: ["Last 30 days"], last14: ["Last 14 days"], last7: ["Last 7 days"] };
const span = (a, b) => mdy(a) + "–" + (a.slice(5, 7) === b.slice(5, 7) ? +b.slice(8) : mdy(b));
// ESPN's fantasy news (Rotowire's blurbs): context only, it never moves a number
const newsItem = (x, who = "", story = true) => `<li><div class="small"><span class="muted">${when(x.date)}</span>${who}${x.new ? `<span class="tag safe" title="Since your snapshot">new</span>` : ""}</div>
  <div>${esc(x.headline)}</div>${story && x.story ? `<div class="small muted">${esc(x.story)}</div>` : ""}</li>`;
// the buy list's gap: his worth to your build vs what the market pays, both on the market's 100 scale
function mktRead(d) {
  const g = d.fit - d.mkt, me = S.state.me, theirs = d.team && d.team !== "FA" && d.team !== me;
  return Math.abs(g) < 5 ? "The market prices him about right for your build."
    : g > 0 ? `The market prices him below his worth to your build${theirs ? ", so he's one to buy" : d.team === me ? ", so don't sell him cheap" : ""}.`
    : `The market prices him above his worth to your build${d.team === me ? ", so he's one to sell" : theirs ? ", so don't overpay" : ""}.`;
}
function playerCard() {
  const C = S.card, d = C.data, me = S.state.me, cats = S.state.cats;
  if (!d) return `<div class="pcard">${C.error ? `<span class="neg">Couldn't load ${esc(C.name)}: ${esc(C.error)}</span>` : `<div class="skel" style="margin:4px 0"></div><div class="skel" style="margin:4px 0;width:60%"></div>`}</div>`;
  const theirs = d.team && d.team !== "FA" && d.team !== me;
  const own = d.team === me ? "your team" : theirs ? esc(d.team) : d.waiver ? `free agent, on waivers until ${esc(d.waiver)}` : "free agent";
  const act = d.team === me ? `<button class="btn" data-act="shop" data-name="${esc(d.name)}">Find buyers</button>`
    : theirs ? `<button class="btn" data-act="offers" data-name="${esc(d.name)}" data-team="${esc(d.team)}">Find offers</button>` : "";
  const lines = Object.entries(d.lines).map(([k, l]) => `<tr><td${LINES[k][1] ? ` title="${LINES[k][1]}"` : ""}>${LINES[k][0]}</td><td class="n muted">${l.gp ?? ""}</td><td class="n muted">${l.MIN == null ? "—" : l.MIN.toFixed(1)}</td>
    ${cats.map(c => `<td class="n ${punted(c) ? "punted-col" : ""}">${l[c] == null ? "—" : l[c].toFixed(1)}</td>`).join("")}</tr>`).join("");
  const games = d.weeks.map((w, i) => `<div><dt${i ? "" : ` title="NBA games left in your matchup week"`}>${i ? span(w.start, w.end) : "This week"}</dt>
    <dd class="${w.games <= 1 ? "neg" : w.games >= 4 ? "pos" : ""}">${w.games}</dd></div>`).join("");
  const read = mktRead(d), inCmp = S.compare.names.includes(d.name);
  return `<div class="pcard">
    <div class="pcard-h"><div><b>${esc(d.name)}</b>${statusTag(d)} <span class="muted small">${[esc(d.nba), esc(d.pos), own].filter(Boolean).join(" · ")}</span></div>
      <div class="toolbar">${act}<button class="btn" data-act="cmp-add" data-name="${esc(d.name)}" title="${inCmp ? "Open Compare" : "Add him to Compare (2 to 4 players side by side)"}">${inCmp ? "Open compare" : "Compare"}</button><button class="btn ghost" data-act="card" data-name="${esc(C.name)}" data-t="${C.t}">Close</button></div></div>
    ${d.injury ? `<div class="small">${esc(d.injury)}${d.return ? ` <span class="muted">Expected back ${mdy(d.return)}.</span>` : ""}</div>` : ""}
    ${d.lift ? `<div class="small">${d.lift.map(l => `While ${liftWhen(l)}: ${[["MIN", "min"], ...cats.filter(c => l[c] != null).map(c => [c, lab(c)])]
      .filter(([c]) => c === "MIN" || Math.abs(l[c]) >= 0.2).map(([c, n]) => `<span class="${punted(c) ? "punted-col" : ""}">${l[c] > 0 ? "+" : ""}${l[c].toFixed(1)} ${n}</span>`).join(", ")} a game.`).join(" ")}
      <span class="muted">His lines count it for those games only.</span></div>` : ""}
    <div class="tw"><table><thead><tr><th>Per game</th><th class="n">GP</th><th class="n">MIN</th>${cats.map(c => `<th class="n ${punted(c) ? "punted-col" : ""}">${lab(c)}</th>`).join("")}</tr></thead>
      <tbody>${lines}</tbody></table></div>
    <dl class="side-by">${games}
      <div class="sep"><dt title="Trade-market value (100 = the market's top player) and market rank, from Yahoo's preseason and current ranks">Market</dt><dd>${mktCell(d)}</dd></div>
      <div><dt title="His rank on your build (rest-of-season value over the games he'll play), valued on the same curve as the market">Your build</dt><dd>${Math.round(d.fit)} <span class="muted small">#${d.fit_rank}</span></dd></div></dl>
    <div class="small muted">${read}</div>
    ${d.news?.length ? `<div><h3 class="small muted">Latest news <span title="ESPN's fantasy news. It never changes a number by itself">(ESPN)</span></h3><ul class="news">${d.news.map(x => newsItem(x)).join("")}</ul></div>` : ""}</div>`;
}
// the top bar's search: under his name in a player table on screen, else in a panel at the top of the view (t -1)
function showCard(name) {
  const row = [...document.querySelectorAll("#view .rowbtn[data-act=card]")].find(b => b.dataset.name === name && b.offsetParent);
  const t = row ? +row.dataset.t : -1;
  if (S.card.name !== name || S.card.t !== t) openCard(name, t);
  if (t < 0) window.scrollTo({ top: 0, behavior: "smooth" }); else reveal($("#view .card-row")?.previousElementSibling);
}
async function pickGlobal(q, exact) {
  if (!S.state) return;
  if (!S.pool) loadPool();
  await S.poolLoad;
  const p = matchPlayer(S.pool, q, exact); if (!p) return;
  $("#top-player").value = "";
  showCard(p.name);
}
async function openCard(name, t) {
  if (S.card.name === name && S.card.t === t) { S.card = {}; return render(); }
  const C = S.card = { name, t }; render();
  try { C.data = await api("/api/player", { name }); } catch (e) { C.error = e.message; }
  if (S.card === C) render();
}

// ---------- views ----------
function viewTeam() {
  const st = S.state, prof = st.profile, n = st.teams.length;
  let strip = "", vs = "";
  if (prof) {
    const ranks = prof.ranks[st.me], cheap = prof.cheap.filter(x => !punted(x.cat)).slice(0, 3);
    strip = `<div class="panel"><div class="panel-h"><div><h2>Category odds</h2><p>Chance you win each category in a typical week, averaged over every opponent. Rank is where those odds place you in the league.</p></div>
      ${prof.punt_suggestions.length && !prof.punt_suggestions.every(punted) ? `<button class="btn" data-act="apply-punt" title="You win these under 35% of weeks">Punt ${prof.punt_suggestions.map(lab).join(" + ")}</button>` : ""}</div>
      <div class="cats" style="--n:${st.cats.length}">${st.cats.map(c => `<div class="cat ${punted(c) ? "punted" : ""}"><span class="lbl">${lab(c)}</span>
          <span class="rk">${pct(prof.odds[c])}</span>

    const rows = Object.entries(prof.vs).sort((a, b) => b[1].pct - a[1].pct);

      <div class="vs">${rows.map(([t, r]) => `<div class="vs-row"><button class="rowbtn" data-act="open-team" data-team="${esc(t)}">

      ${sells.map(p => `<tr><td>Sell high on <b>${esc(p.name)}</b>: ${sign(p.gap)} above his real value over ${formWin()}</td><td class="n muted">${p.form_gp} GP</td><td class="n"><button class="btn ghost" data-act="shop" data-name="${esc(p.name)}">Find a buyer</button></td></tr>`).join("")}
    </tbody></table></div></div>` : "";
  const outlook = prof ? `Projected ${ord(prof.rank)} of ${n} · wins ${pct(prof.win)} of ${oneWin() ? "weekly matchups" : "categories"} · ` : "";

    ${newsPanel()}
    ${prof ? strategyPanel() : ""}${vs}`;
}

// ---------- punt planner: every build's plan on real odds, on demand (up to three trade searches per build, ~15s) ----------
const buildName = b => b.length ? b.map(lab).join(" + ") : "No punt";
const plural = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`;
const planMoves = b => { const adds = b.steps.reduce((n, s) => n + s.add.length, 0), trades = b.steps.length - 1;
  return and([...(adds ? [plural(adds, "waiver add")] : []), ...(trades ? [plural(trades, "trade")] : [])]) || "no moves"; };
function strategyPanel() {
  const P = S.strategy, d = P.data, p1 = v => v.toFixed(1) + "%";
  const th = (h, tip, cls = "n") => `<th class="${cls}" title="${esc(tip)}">${h}</th>`;
  const line = `style="border-top:1px solid var(--line)"`;
  const head = `<div class="panel-h"><div><h2>Strategy</h2><p>Should you punt? Each build makes its waiver adds, then up to three fair trades in a row, scored on your real odds.</p></div>
    <button class="btn primary" data-act="plan" ${P.busy ? "disabled" : ""}>${P.busy ? "Comparing…" : d ? "Compare again" : "Compare builds"}</button></div>`;
  if (P.busy) return `<div class="panel">${head}<div class="empty"><b>Comparing builds…</b>Each one runs up to three trade searches, so this takes about 15 seconds.</div>${SKEL}</div>`;
  if (!d) return `<div class="panel">${head}<div class="empty"><b>Should you punt?</b>Punting a category only lowers today's odds. It pays off through the moves it unlocks, often over a few trades. Compare builds to see if any punt's plan beats staying balanced.</div></div>`;
  const best = d.builds[0], flat = d.builds.find(b => !b.punt.length);
  const [cls, pill, why] = d.pick.length
    ? ["accept", `Punt ${buildName(d.pick)}`, `Its plan beats staying balanced by ${delta(d.edge, "win%")}.`]
    : ["toss-up", "Stay balanced", best.punt.length ? `The best punt, ${buildName(best.punt)}, is only ${delta(d.edge, "win%")} ahead, too close to call.` : "No punt beats it once its moves are made."];
  const sel = P.sel ?? d.builds.indexOf(d.pick.length ? best : flat), b = d.builds[sel];
  // the plan: waiver adds, then each trade on the rosters the one before leaves (and the adds it opens up)
  const steps = b.steps.map((s, j) => {
    const prev = j ? b.steps[j - 1].win : d.win;
    const after = (span = "") => `<td class="n val"${span}>${p1(s.win)}</td><td class="n ${tone(s.win - prev)}"${span}>${delta(s.win - prev, "win%")}</td>`;
    if (!s.trade) return `<tr><td class="muted">Waivers</td><td colspan="6" class="names">${s.free.length ? "Add " + freeList(s.free) : `<span class="muted">No waiver move clears the bar</span>`}</td>${after()}<td></td></tr>`;
    // its waiver moves (open spots, extra players, the adds it opens up) go on a line below the deal
    const t = s.trade, span = s.add.length || s.drop.length ? ` rowspan="2"` : "";
    const wire = [...(s.add.length ? [`add ${and(s.add.map(esc))}`] : []), ...(s.drop.length ? [`drop ${and(s.drop.map(esc))}`] : [])].join(", ");
    return `<tr${span ? ` class="has-sub"` : ""}><td class="muted"${span}>Trade ${j}</td><td>${esc(t.team)}</td><td class="names">${t.give.map(esc).join(", ")}</td>
      <td class="names">${t.get.map(esc).join(", ")}</td>
      <td class="n ${tone(t.their_net)}">${delta(t.their_net, "win%")}</td><td class="n">${mktDeal(t.market)}</td><td>${acceptPill(t.accept)}</td>${after(span)}
      <td class="n"${span}><button class="btn ghost" data-act="plan-load" data-i="${sel}" data-j="${j}" ${t.later ? `disabled title="Needs the trades before it first: Trades scores a deal on today's rosters"` : `title="Open it in Trades, scored on today's rosters and your punt"`}>Load</button></td></tr>
      ${span ? `<tr class="sub"><td colspan="6" class="names small muted">Then on waivers: ${wire}</td></tr>` : ""}`;
  }).join("");
  const cats = and(b.punt.map(lab));
  const fit = b.punt.length ? `<div class="panel-b small muted" ${line}>Star fit: ${b.stars.length
    ? and(b.stars.map(x => `<b>${esc(x.name)}</b> (${lab(x.cat)} ${x.z.toFixed(1)})`)) + (new Set(b.stars.map(x => x.name)).size > 1 ? ". Their weak spots stop costing you." : ". His weak spot stops costing you.")
    : `none of your top five players is weak in ${cats}.`}</div>` : "";
  const strategy = `<div class="panel" id="strategy">${head}
    <div class="panel-b"><div class="verdict"><span class="pill ${cls}" style="text-transform:none">${pill}</span><span class="small">${why}</span></div></div>
    <div class="panel-b small" ${line}><b>Plan: ${buildName(b.punt)}</b> <span class="muted">· ${planMoves(b)}, ${p1(d.win)} → ${p1(b.win)}</span></div>
    <div class="tw" ${line}><table><thead><tr>${th("Step", "Waiver adds first, then each trade on the rosters the one before leaves", "")}${th("Partner", "Trade partner", "")}<th>You give</th><th>You get</th>
      ${th("Them", "Change in their " + WIN().of + " from the trade")}${th("Market", MKT_TIP)}${th("Will they say yes", "Mostly the market, a little how it really helps them", "")}
      ${th(WIN().h + " after", "After this step, on real odds: a punted category still counts when you win it")}${th("Change", "From the step before (today, for the waiver adds)")}<th></th></tr></thead>
      <tbody>${steps}</tbody></table></div>${fit}</div>`;
  // the buy list: players other teams own that the market (Yahoo's ranks, every category) prices below their worth to this build
  const owner = { h: "Team", v: p => esc(p.team) }, rank = { h: `<span title="His rank on this build. Compare it with his market rank in Mkt">Fit</span>`, v: p => `#${p.fit_rank}` };
  const offers = { h: "", v: p => `<button class="btn ghost" data-act="offers" data-name="${esc(p.name)}" data-team="${esc(p.team)}">Find offers</button>` };
  const buy = `<div class="panel"><div class="panel-h"><div><h2>Buy list: ${buildName(b.punt)}</h2><p>Players on other teams the market prices furthest below their worth to this build. Yahoo's ranks count every category, so a player who's weak only where you punt comes cheap.</p></div></div>
    ${playerTable(b.buy, { extra: [owner, rank, offers], dim: b.punt, empty: "<b>Nobody's a bargain</b>No player on another team is cheaper on the market than his worth to this build." })}</div>`;
  // the sell list, its mirror: your players the market prices furthest above their worth to this build, and why
  const reason = { h: `<span title="What makes up most of the gap between his market value and his worth to this build">Why</span>`, v: p => esc(p.why), cls: "why small muted" };
  const buyers = { h: "", v: p => `<button class="btn ghost" data-act="shop" data-name="${esc(p.name)}">Find buyers</button>` };
  const sell = `<div class="panel"><div class="panel-h"><div><h2>Sell list: ${buildName(b.punt)}</h2><p>Your players the market prices furthest above their worth to this build: what you can get for them beats what they do for you.</p></div></div>
    ${playerTable(b.sell, { extra: [rank, reason, buyers], dim: b.punt, empty: "<b>Nobody's overpriced</b>The market values none of your players 5 or more above his worth to this build." })}</div>`;
  // every build: the win % after each step (red: a step that costs on its own, paid back by a later trade)
  const path = x => x.steps.map((s, i) => `<span class="${s.win < (i ? x.steps[i - 1].win : d.win) ? "neg" : ""}">${s.win.toFixed(1)}</span>`).join(` <span class="muted">→</span> `);
  const rows = d.builds.map((x, i) => `<tr${i === sel ? ` class="sel"` : ""}><td><button class="rowbtn" data-act="plan-show" data-i="${i}" aria-pressed="${i === sel}" title="Show this build's plan, buy list and sell list">${buildName(x.punt)}</button>${x.punt.length === S.punt.length && x.punt.every(punted) ? `<span class="tag">current</span>` : ""}</td>
    <td class="muted">${planMoves(x)}</td><td class="small">${path(x)}</td>
    <td class="n val">${p1(x.win)}</td><td class="n ${tone(x.gain)}">${delta(x.gain, "win%")}</td></tr>`).join("");
  const every = `<div class="panel"><div class="panel-h"><div><h2>Every build</h2><p>Staying balanced, every single punt and six common pairs. Pick one to see its plan, buy list and sell list.</p></div></div>
    <div class="tw"><table><thead><tr>${th("Build", "The categories this build concedes", "")}${th("Moves", "Waiver adds (before and between trades) and trades in its plan", "")}
      ${th("Path", `Your ${WIN().of} after the waiver adds and after each trade. Red: a step that costs on its own, paid back by a later trade`, "")}
      ${th(WIN().h + " after", "After the whole plan, on real odds")}${th("vs now", "Change from your " + WIN().of + " today")}</tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="panel-b small muted" ${line}>Staying balanced also tries every other build's trades and repeats each build's plan for as long as every trade still lifts your real odds, since it could make them too. So a punt only wins through moves it alone unlocks: its waiver adds, or trades that only pay off after a costly first one.</div></div>`;
  return strategy + buy + sell + every;
}

  try { P.data = await api("/api/strategy", {}); } catch (e) { toast(e.message); }

    { h: "Drop", v: p => esc(p.drop) }, { h: `<span title="Change in your season-long ${WIN().of} if you keep him">Season</span>`, v: p => `<span class="${tone(p.season)}">${delta(p.season, "win%")}</span>` }, ...claim];

      <div class="panel-b small muted" style="border-top:1px solid var(--line)">${advice} ${yg ? `Games played so far: ${yg.you.played} vs ${yg.them.played}.` : ""} Projected = ${w.live ? "the score so far plus " : ""}each player's games left × his per-game line × his chance of playing. Players in IL slots sit.

const dayName = d => new Date(d + "T12:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
const weekName = (w, i) => i ? span(w.start, w.end) : "This week";

      v: p => { const x = p.sched[i], lost = x.games - x.starts; return `<span class="${x.games >= 4 ? "pos" : x.games <= 1 ? "neg" : ""}">${x.games}</span>${lost ? ` <span class="small neg" title="${lost} of his ${x.games} games land on days your lineup is full">−${lost}</span>` : ""}`; } })) })}</div>`

function calendarPanel(d) {
  const T = S.plan, L = d.lineup, all = d.weeks.flatMap(w => w.days);

async function ask(text) {
  if (!text.trim() || S.chatBusy) return;
  S.chat.push({ role: "user", text }); S.chatBusy = true; render();
  try { const r = await api("/api/chat", { message: text, session: S.chatSession, ...S.gmSet }); S.chat.push({ role: "ai", text: r.reply });
    if (r.session) store.set("chatSession", S.chatSession = r.session); }
  catch (e) { S.chat.push({ role: "ai", text: "Error: " + e.message }); }
  S.chatBusy = false; store.set("chat", S.chat); render();
  try { await saveChat(); } catch (e) { toast("Couldn't save this conversation: " + e.message); }
  if (S.view === "gm") render();
}

// ---------- shell ----------
function renderShell() {
  const st = S.state;
  document.querySelectorAll(".nav").forEach(b => b.dataset.view === S.view ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  if (!st) return;
  $("#league").innerHTML = `<b>${esc(st.league)}</b><span>${st.mode === "points" ? "Points" : st.cats.length + "-cat"} · ${st.teams.length} teams${st.demo ? " · demo data" : ""} ·
    <select id="me-team" class="me" aria-label="Your team" title="Which team is yours">${st.teams.map(t => opt(t, t, st.me)).join("")}</select></span>`;
  $("#fetched").textContent = st.pulled ? "Snapshot pulled " + when(st.pulled) : st.fetched ? "Rosters as of " + st.fetched : "";
  $("#punts").innerHTML = st.mode === "points" ? "" : `<span>Punt</span>${st.cats.map(c => `<button class="chip" data-punt="${c}" aria-pressed="${punted(c)}" title="${punted(c) ? "Stop punting" : "Punt"} ${lab(c)}">${lab(c)}</button>`).join("")}`;
}
function render() {
  renderShell();
  const v = $("#view");
  if (S.error && !S.state) { v.innerHTML = `<div class="panel err">Couldn't load your league: ${esc(S.error)}. Is <code>python app.py</code> running?</div>`; return; }
  if (!S.state) return;
  const demo = S.state.demo && S.view === "team" ? `<div class="notice">This is a demo league drafted from real stats. Connect your Yahoo league with <code>python yahoo.py</code> (see README) to see your real team.</div>` : "";
  const st = S.state, age = st.pulled ? (Date.now() - new Date(st.pulled)) / 864e5 : 0;
  const stale = st.rolled || age > 1 ? `<div class="notice">Your snapshot ${st.rolled ? "is from last week's matchup" : `is ${Math.floor(age)} day${age >= 2 ? "s" : ""} old`} (pulled ${when(st.pulled)}), so the score and recent moves aren't in. Drop a new snapshot in the project folder and press Refresh.</div>` : "";
  TBL = 0;
  const card = S.card.t === -1 ? `<div class="panel card-panel" role="region" aria-label="Player card">${playerCard()}</div>` : "";
  v.innerHTML = card + demo + stale + ({ team: viewTeam, week: viewWeek, schedule: viewSchedule, league: viewLeague, trades: viewTrades, waivers: viewWaivers, movers: viewMovers, compare: viewCompare, gm: viewGM }[S.view] || viewTeam)();
  const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight;
}
function setView(v) { S.view = v; S.card = {}; store.set("view", v); history.replaceState(null, "", "#" + v); render(); window.scrollTo(0, 0); }

document.addEventListener("click", async e => {
  const t = e.target.closest("button, [data-pick]"); if (!t) return;
  if (t.dataset.view) return setView(t.dataset.view);
  if (t.dataset.go) return setView(t.dataset.go);
  if (t.dataset.punt) {
    const c = t.dataset.punt;
    S.punt = punted(c) ? S.punt.filter(x => x !== c) : [...S.punt, c];
    const re = S.trade.result, mv = S.move.result;
    store.set("punt", S.punt); S.move.result = null; S.trade.result = null; S.find.list = null; S.improve = { kind: null, list: null }; S.saved.evals = {};
    S.league.data = null; S.trade.roster = null; S.week = {}; S.sched = {}; S.card = {}; setCompare(S.compare.names);
    await loadState();
    if (mv) evalMove();
    return re && evaluate();
  }
  if (t.dataset.tier) { S.find.tier = t.dataset.tier; S.find.list = null; S.improve = { kind: null, list: null }; return render(); }
  if (t.dataset.goalcat) {
    const F = S.find, c = t.dataset.goalcat;
    F.cats = F.cats.includes(c) ? F.cats.filter(x => x !== c) : [...F.cats, c]; F.list = null; S.improve = { kind: null, list: null }; return render();
  }
  if (t.dataset.sort) {
    const b = S[t.dataset.src], k = t.dataset.sort;
    b.sort = b.sort?.k === k ? { k, dir: -b.sort.dir } : { k, dir: k === "team" ? 1 : -1 }; return render();
  }
  if (t.dataset.sug) return ask(t.dataset.sug);
  const act = t.dataset.act;
  if (act === "apply-punt") { S.punt = [...new Set([...S.punt, ...S.state.profile.punt_suggestions])]; store.set("punt", S.punt); return loadState(); }
  if (act === "plan") return plan();
  if (act === "plan-load") { const x = S.strategy.data.builds[+t.dataset.i].steps[+t.dataset.j].trade; setView("trades"); return loadDeal(x); }
  if (act === "plan-show") { S.strategy.sel = +t.dataset.i; render(); return reveal("#strategy"); }
  if (act === "card") return openCard(t.dataset.name, +t.dataset.t);
  if (act === "cmp-add") return addCompare(t.dataset.name, true);
  if (act === "cmp-remove") { setCompare(S.compare.names.filter(x => x !== t.dataset.name)); if (S.compare.names.length < 2) history.replaceState(null, "", "#compare"); return render(); }
  if (act === "cmp-clear") { setCompare([]); history.replaceState(null, "", "#compare"); return render(); }
  if (act === "cmp-retry") { S.compare.error = null; return render(); }
  if (act === "cmp-line") { S.compare.line = t.dataset.line; return render(); }
  if (act === "open-team") return openTeam(t.dataset.team);
  if (act === "trade-with") { S.trade.team = t.dataset.team; S.trade.get.clear(); S.trade.result = null; return setView("trades"); }
  if (act === "shop" || act === "offers") {  // Find a buyer (My team) / buy-low rows (Hot & cold)
    const mine = act === "shop", name = [t.dataset.name];
    Object.assign(S.trade, { give: new Set(mine ? name : []), get: new Set(mine ? [] : name), result: null });
    if (!mine) S.trade.team = t.dataset.team;
    setView("trades");
    return isPoints() || find(true);
  }
  if (act === "lock") {
    e.preventDefault();  // it sits inside the player's label: don't toggle the checkbox too
    const n = t.dataset.name; S.locks.has(n) ? S.locks.delete(n) : S.locks.add(n);
    store.set("locks", [...S.locks]); return render();
  }
  if (act === "clear-trade") { S.trade.give.clear(); S.trade.get.clear(); S.trade.result = null; history.replaceState(null, "", "#trades"); return render(); }
  if (act === "evaluate") return evaluate();
  if (act === "week-retry") { S.week = {}; return render(); }
  if (act === "sched-retry") { S.sched = {}; return render(); }
  if (act === "sched-day") { S.plan.day = t.dataset.date; return render(); }
  if (act === "sched-open") { S.plan.open = t.dataset.open === "1"; return render(); }
  if (act === "find") return find();
  if (act === "mv-eval") return evalMove();
  if (act === "mv-clear") { S.move = { add: "", drop: "", result: null, busy: false }; history.replaceState(null, "", "#waivers"); return render(); }
  if (act === "mv-try") {
    const M = S.move;
    if ("add" in t.dataset) M.add = t.dataset.add;
    if ("drop" in t.dataset) M.drop = t.dataset.drop;
    M.result = null; reveal("#move");
    if (M.add) return evalMove();
    render(); return $("#mv-add")?.focus();
  }
  if (act === "improve") return improve(t.dataset.kind);
  if (act === "load-deal") return loadDeal(S[t.dataset.src].list[+t.dataset.i]);
  if (act === "save-deal") return saveDeal(S[t.dataset.src].list[+t.dataset.i]);
  if (act === "save-result") return saveDeal(resultDeal(S.trade.result));
  if (act === "load-saved") return loadDeal(S.saved.list[+t.dataset.i]);
  if (act === "unsave") { S.saved.list.splice(+t.dataset.i, 1); store.set("saved", S.saved.list); return render(); }
  if (act === "pitch") {
    const r = S.trade.result;
    setView("gm");
    return ask(`Evaluate this trade and write a short casual pitch I can send to ${r.other_team}: I give ${r.give.map(p => p.name).join(", ")}, I get ${r.get.map(p => p.name).join(", ")}.`);
  }
  if (act === "reset-chat") return newChat();
  if (act === "chat-open") return openChat(t.dataset.id);
  if (act === "chat-delete") {
    if (!confirm("Delete this conversation? This can't be undone.")) return;
    try { S.chats = await api("/api/chats", { delete: S.chatId }); } catch (err) { return toast(err.message); }
    return newChat();
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.pick) { const set = S.trade[t.dataset.pick]; t.checked ? set.add(t.value) : set.delete(t.value); S.trade.result = null; return render(); }
  if (t.id === "trade-team") { S.trade.team = t.value; S.trade.get.clear(); S.trade.result = null; return render(); }
  if (t.id === "find-player") return pickPlayer(t.value);
  if (t.id === "cmp-player") return pickCompare(t.value);
  if (t.id === "mv-add") return pickMove(t.value);
  if (t.id === "mv-drop") { Object.assign(S.move, { drop: t.value, result: null }); return render(); }
  if (t.id === "top-player") return pickGlobal(t.value);
  if (t.id === "week-opp") { S.week = {}; loadWeek(t.value); return render(); }
  if (t.id.startsWith("gm-")) { S.gmSet[t.id.slice(3)] = t.type === "checkbox" ? t.checked : t.value; store.set("gmSet", S.gmSet); return render(); }
  if (t.id === "me-team") {  // switch which team is yours: everything team-specific starts over
    t.disabled = true;
    try {
      S.state = await api("/api/me", { team: t.value });
      Object.assign(S.trade, { give: new Set(), get: new Set(), team: null, roster: null, result: null });
      S.find.list = null; S.improve = { kind: null, list: null }; S.saved.evals = {}; S.league.data = null; S.players = null; S.week = {}; S.sched = {}; S.news = {}; S.strategy = {}; S.card = {}; S.pool = null; setCompare(S.compare.names);
      S.move = { add: "", drop: "", result: null, busy: false };
      toast(`You're ${t.value} now`);
    } catch (err) { toast(err.message); }
    return render();
  }
  if (t.id === "f-theirs") {  // changes every trade number, not just the finder's
    S.find.theirs = t.checked; store.set("theirs", t.checked);
    S.find.list = null; S.improve = { kind: null, list: null }; S.saved.evals = {};
    return S.trade.result ? evaluate() : render();
  }
  if (t.id.startsWith("f-")) {  // finder toolbar: f-goal, f-vs, f-size, f-shape, f-overpay, f-healthy, f-team
    const F = S.find, k = t.id.slice(2), prof = S.state.profile;
    F[k] = t.type === "checkbox" ? t.checked : k === "size" ? +t.value : t.value;
    if (F.goal === "cats" && !F.cats.length) F.cats = Object.entries(prof.odds).filter(([c]) => !punted(c)).sort((a, b) => a[1] - b[1]).slice(0, 2).map(([c]) => c);
    if (F.goal === "team" && !F.vs) F.vs = Object.keys(prof.standings).find(x => x !== S.state.me);
    F.list = null; S.improve = { kind: null, list: null }; return render();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "find-player") pickPlayer(e.target.value, true);
  if (e.target.id === "cmp-player") pickCompare(e.target.value, true);
  if (e.target.id === "mv-add" && !/^(insertText|insertCompositionText|delete)/.test(e.inputType || "")) pickMove(e.target.value, true);  // a pick or a paste, not typing
  // the top bar opens a card as soon as a name is picked or pasted, not while one is typed ("Player 1" on the way to "Player 15")
  if (e.target.id === "top-player" && !/^(insertText|insertCompositionText|delete)/.test(e.inputType || "")) pickGlobal(e.target.value, true);
});
document.addEventListener("focusin", e => { if (e.target.id === "top-player" && !S.pool && S.state) loadPool(); });
document.addEventListener("submit", e => {
  if (e.target.id !== "chat-form") return;
  e.preventDefault(); const i = $("#chat-in"); const text = i.value; i.value = ""; ask(text);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey && !e.target.closest("input, textarea, select, [contenteditable]")) { e.preventDefault(); $("#top-player").focus(); }
  if (e.target.id === "chat-in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#chat-form").requestSubmit(); }
});
$("#refresh").addEventListener("click", async e => {
  const b = e.currentTarget; b.classList.add("busy"); b.disabled = true;
  try {
    S.state = await api("/api/refresh", {}); S.league.data = null; S.trade.roster = null; S.find.list = null; S.saved.evals = {}; S.players = null; S.week = {}; S.sched = {}; S.news = {}; S.strategy = {}; S.card = {}; S.pool = null; setCompare(S.compare.names); S.move.result = null;
    toast("League refreshed");
  } catch (err) { toast("Refresh failed: " + err.message); }
  b.classList.remove("busy"); b.disabled = false; render();
});
render();
if (S.view === "compare" && link.has("players")) setCompare(link.get("players").split(",").filter(Boolean));
loadState().then(() => {
  if (S.state && S.view === "waivers" && link.has("add")) { Object.assign(S.move, { add: link.get("add"), drop: link.get("drop") || "" }); return evalMove(); }
  if (!S.state || S.view !== "trades" || !(link.has("give") || link.has("get"))) return;
  const names = k => (link.get(k) || "").split(",").filter(Boolean);
  Object.assign(S.trade, { give: new Set(names("give")), get: new Set(names("get")) });
  evaluate();
});
</script>
