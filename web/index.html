<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy GM</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: oklch(97.4% 0.004 260);
  --panel: oklch(100% 0 0);
  --panel-2: oklch(98.6% 0.003 260);
  --line: oklch(91.5% 0.006 260);
  --line-strong: oklch(85% 0.008 260);
  --text: oklch(23% 0.016 260);
  --muted: oklch(49% 0.016 260);
  --faint: oklch(55% 0.012 260);  /* 4.5:1 on panel-2 and bg: tertiary text, placeholders */
  --accent: oklch(51% 0.19 268);
  --accent-hover: oklch(46% 0.19 268);
  --accent-soft: oklch(95.5% 0.028 268);
  --accent-ink: oklch(40% 0.17 268);
  --pos: oklch(66% 0.15 152);
  --neg: oklch(63% 0.19 24);
  --pos-ink: oklch(42% 0.12 152);
  --neg-ink: oklch(47% 0.17 24);
  --warn-soft: oklch(95% 0.05 85);
  --warn-ink: oklch(45% 0.1 70);
  --shadow: 0 1px 2px oklch(30% 0.02 260 / 0.06), 0 4px 12px oklch(30% 0.02 260 / 0.05);
  --radius: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: oklch(17.5% 0.008 260);
    --panel: oklch(21% 0.009 260);
    --panel-2: oklch(23.5% 0.01 260);
    --line: oklch(29% 0.01 260);
    --line-strong: oklch(36% 0.012 260);
    --text: oklch(93% 0.006 260);
    --muted: oklch(72% 0.012 260);
    --faint: oklch(64% 0.012 260);
    --accent: oklch(66% 0.17 268);
    --accent-hover: oklch(72% 0.15 268);
    --accent-soft: oklch(30% 0.06 268);
    --accent-ink: oklch(82% 0.1 268);
    --pos: oklch(62% 0.14 152);
    --neg: oklch(60% 0.17 24);
    --pos-ink: oklch(80% 0.12 152);
    --neg-ink: oklch(78% 0.13 24);
    --warn-soft: oklch(30% 0.05 80);
    --warn-ink: oklch(85% 0.09 80);
    --shadow: 0 1px 2px oklch(0% 0 0 / 0.3), 0 6px 16px oklch(0% 0 0 / 0.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-soft); color: var(--accent-ink); }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-ink); text-underline-offset: 3px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* shell */
.app { display: grid; grid-template-columns: 216px 1fr; min-height: 100%; }
.side { background: var(--panel-2); border-right: 1px solid var(--line); padding: 16px 10px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 10px 18px; font-weight: 650; font-size: 15px; }
.brand-mark { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: white; display: grid; place-items: center; }
.brand-mark svg { width: 15px; height: 15px; stroke-width: 2; }
.nav { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; border: 0; background: none; text-align: left; color: var(--muted); cursor: pointer; font-weight: 500; transition: background .15s, color .15s; }
.nav:hover { background: var(--line); color: var(--text); }
.nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
.side-foot { margin-top: auto; padding: 10px; color: var(--faint); font-size: 12px; }
.fresh { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; margin-top: 6px; }
.fresh .warn { color: var(--warn-ink); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in oklch, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 10px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.league { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.league b { font-size: 15px; font-weight: 650; white-space: nowrap; }
.league span { color: var(--muted); font-size: 12px; }
.league .m-only { display: none; }
select.me { field-sizing: content; border: 0; background: none; padding: 0 2px; font-size: 12px; color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.punts { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.punts > span { color: var(--muted); font-size: 12px; margin-right: 4px; white-space: nowrap; flex: none; }
.top-find { width: 220px; }
.chip { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 550; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
.chip:hover { border-color: var(--faint); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 6px; padding: 6px 12px; font-weight: 550; cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap; }
.btn:hover { background: var(--panel-2); border-color: var(--faint); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--line); }
.btn.ghost[aria-expanded="true"] { color: var(--accent-ink); }  /* a fold that's open (The week day by day, More paths) */
.btn svg { width: 15px; height: 15px; }
.btn.busy svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.content { padding: 24px; display: flex; flex-direction: column; gap: 20px; max-width: 1360px; width: 100%; }
.content > *, .grid2 > * { min-width: 0; }
h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 650; margin: 0; }
.sub { color: var(--muted); margin: 4px 0 0; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
/* Q33: My team's trend lines, one small single-series line each (win %, playoff odds) with a crosshair readout */
.trends { display: flex; gap: 6px 20px; flex-wrap: wrap; }
.trend { display: grid; grid-template-columns: auto auto; column-gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.trend-l { grid-column: 1 / -1; font-weight: 600; }
.trend svg { display: block; overflow: visible; touch-action: none; }
.trend path { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.trend circle { fill: var(--text); stroke: var(--bg); stroke-width: 2; }
.trend .xh { stroke: var(--line-strong); stroke-width: 1; visibility: hidden; }
.trend svg:hover .xh { visibility: visible; }
.trend-v { color: var(--text); font-weight: 650; font-size: 13px; white-space: nowrap; min-width: 9ch; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel-h p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.panel-h > .toolbar { min-width: 0; }  /* so a wide .seg scrolls inside it on a phone */
.panel-b { padding: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.notice { padding: 9px 14px; border-radius: var(--radius); background: var(--warn-soft); color: var(--warn-ink); font-size: 13px; }
.notice code { font-size: 12px; }
.notice.moves > div + div { margin-top: 4px; }
/* Q29: a roster problem to fix on Yahoo (My team, This week): a panel-weight strip with a red dot, never a warn notice
   (those are for data sources); the nav's My team button carries the same dot while one is open */
.alert { display: flex; gap: 10px; align-items: baseline; padding: 11px 14px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow); font-size: 13px; }
.alert > .dot { background: var(--neg); flex: none; margin: 0; transform: translateY(-1px); }
.alert p { margin: 0; }
.alert .btn { padding-block: 1px; margin-left: 4px; }
.nav-sep { height: 1px; background: var(--line); margin: 6px 10px; flex: none; }
.btn.icon { padding-inline: 8px; }
.nav .flag { width: 7px; height: 7px; border-radius: 50%; background: var(--neg); margin-left: auto; flex: none; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

/* category strip */
.cats { display: grid; grid-template-columns: repeat(var(--n, 9), minmax(0, 1fr)); }
.cat { padding: 12px 10px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; transition: opacity .2s; }
.cat:last-child { border-right: 0; }
.cat .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
.cat .rk { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
.cat .rk small { font-size: 12px; color: var(--faint); font-weight: 500; }
.cat .tot { font-size: 12px; }
.bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 2px; }
.cat.punted { opacity: .38; }
.cat.punted .lbl { text-decoration: line-through; }

/* tables */
.tw { overflow-x: auto; }
/* a table wider than its panel fades out on the side that has more (.more-l / .more-r, set from its scroll position) */
.tw.more-r { mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); }
.tw.more-l { mask-image: linear-gradient(to right, transparent, #000 48px); }
.tw.more-l.more-r { mask-image: linear-gradient(to right, transparent, #000 48px, #000 calc(100% - 48px), transparent); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel); position: sticky; top: 0; }
th.n, td.n { text-align: right; }
td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
table.race th:first-child { width: 100%; }  /* the numbers sit together on the right */
@media (min-width: 761px) { table.race th.n, table.race td.n { padding-left: 22px; } }
tr.cut td { border-bottom-color: var(--faint); }  /* the playoff line */
table.wrap td:nth-child(2) { white-space: normal; width: 100%; }  /* My team's Worth doing now: horizon, then the move */
tbody tr { transition: background .12s; }
tbody tr:hover { background: var(--panel-2); }
td.z { text-align: center; font-size: 12.5px; min-width: 50px; position: relative; transition: opacity .2s, filter .2s; }
td.z::before { content: ""; position: absolute; inset: 2px; border-radius: 4px; background: var(--c, transparent); z-index: 0; }
td.z span { position: relative; }
.punted-col { opacity: .3; filter: grayscale(1); }
th.punted-col, tr.punted-col td:first-child { text-decoration: line-through; }
.flags { margin: 0; padding: 12px 16px 12px 34px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.pname { font-weight: 550; }
.tag { display: inline-block; font-size: 11px; font-weight: 650; padding: 0 5px; border-radius: 4px; background: var(--line); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
.tag.out { background: color-mix(in oklch, var(--neg) 18%, transparent); color: var(--neg-ink); }
.tag.safe { background: color-mix(in oklch, var(--pos) 20%, transparent); color: var(--pos-ink); }
.tag.chase { color: var(--text); }
.val { font-weight: 650; }
.pos { color: var(--pos-ink); }
.neg { color: var(--neg-ink); }
.rowbtn { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; font-weight: 550; }
.rowbtn:hover { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; }
.rowbtn.nm { font-weight: inherit; color: inherit; }  /* a name in running text or a deal (Q21): the card on click, no bold */
.rowbtn.nm:hover { color: var(--accent-ink); }
.rowbtn[aria-pressed="true"] { color: var(--accent-ink); }
tr.sel td { background: var(--accent-soft); }
tr.pick { cursor: pointer; }
tr.sel .rowbtn { color: var(--accent-ink); }
td .btn { padding-block: 0; }  /* row actions (Try, Load, Find offers) keep rows as short as the rest */
tr.has-sub td:not([rowspan]), tr.has-sub:nth-last-child(2) td { border-bottom: 0; }
tr.sub td { padding-top: 0; }
.rowbtn[aria-expanded="true"] { color: var(--accent-ink); }
/* player card: a recessed row under the name, pinned to the visible part of a sideways-scrolling table (100cqi) */
.tw:has(.card-row) { container-type: inline-size; }
tbody tr.card-row, tbody tr.card-row:hover { background: var(--panel-2); }
tr.card-row > td { padding: 0; white-space: normal; }
.pcard { position: sticky; left: 0; max-width: min(860px, 100cqi); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.pcard-h { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.pcard .tw { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.pcard th { position: static; }
.pcard .sep { border-left: 1px solid var(--line); padding-left: 24px; }
.card-panel .pcard { position: static; max-width: none; }  /* the top bar's search: a name on no table on screen */
.news { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; max-width: 72ch; }
h3.small { margin: 0; font-weight: 650; }
details > summary { cursor: pointer; margin-top: 10px; color: var(--muted); }

/* matchups */
.vs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0; }
.vs-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.vs-row > span:last-child { white-space: nowrap; }
.gone { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px 0; }
.vs-row .rowbtn { display: flex; align-items: baseline; min-width: 0; }
.vs-row .dot { flex: none; }
.vs-row .rec { font-weight: 650; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 7px; vertical-align: 1px; }

/* trade */
.picker { display: flex; flex-direction: column; gap: 10px; }
.plist { display: flex; flex-direction: column; max-height: 360px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.pitem, .phead { display: grid; grid-template-columns: 18px 1fr 26px 44px 20px; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.pitem { cursor: pointer; }
.pitem .n, .phead .n { text-align: right; }
.phead { position: sticky; top: 0; z-index: 1; background: var(--panel); padding-top: 7px; padding-bottom: 7px; font-size: 12px; font-weight: 600; color: var(--muted); }
/* the instant tip (Nov 7, Nov 24): a label that needs explaining is underlined dotted; hovering, tapping or focusing it
   shows #tip under it (fixed, so a scrolling table never clips it). Native title tooltips were too slow to notice */
[data-tip] { cursor: help; text-decoration: underline dotted var(--line-strong); text-underline-offset: 3px; text-decoration-thickness: 1px; border-radius: 4px; }
[data-tip]:hover, [data-tip]:focus-visible { color: var(--text); text-decoration-color: var(--muted); }
#tip { position: fixed; z-index: 30; max-width: min(300px, calc(100vw - 16px)); padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); color: var(--text); box-shadow: var(--shadow); font-size: 12.5px; font-weight: 400; line-height: 1.4; text-align: left; white-space: normal; pointer-events: none; }
.pitem:last-child { border-bottom: 0; }
.pitem:hover { background: var(--panel-2); }
.pitem input { accent-color: var(--accent); margin: 0; }
.pitem.on { background: var(--accent-soft); }
select, .input { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 6px; padding: 6px 10px; }
.input::placeholder { color: var(--faint); }
.lock { border: 0; background: none; padding: 5px; margin: -5px -4px -5px 0; border-radius: 4px; color: var(--faint); opacity: .5; cursor: pointer; display: grid; transition: opacity .15s, color .15s; }
.lock svg { width: 15px; height: 15px; }
.lock:hover { opacity: 1; }
.lock[aria-pressed="true"] { opacity: 1; color: var(--text); }
.field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; font-weight: 550; }
.field input { accent-color: var(--accent); margin: 0; }
.chip.pick[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); text-decoration: none; }
.sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
.sort:hover { color: var(--text); }
.sort svg { width: 12px; height: 12px; }
.sort svg.up { transform: rotate(180deg); }
svg.trend { width: 13px; height: 13px; stroke-width: 2.2; vertical-align: -2px; margin-right: 3px; }
svg.trend.down { transform: rotate(180deg); }
td.names { white-space: normal; min-width: 130px; }
td.why { white-space: normal; min-width: 240px; }
.deals { max-height: 456px; overflow: auto; border-radius: 0 0 var(--radius) var(--radius); }  /* ~10 deals; headers stay sticky */
.compare th, .compare td { white-space: normal; min-width: 150px; vertical-align: top; }
.compare th:first-child, .compare td:first-child { min-width: 0; white-space: nowrap; color: var(--muted); font-size: 12px; font-weight: 600; }
.cmp td.z { min-width: 150px; }
.cmp b { font-weight: 700; }
.cmp th { vertical-align: top; }
.btn.cmp-x { margin: 4px 0 0 -8px; padding: 2px 8px; font-size: 12px; }
/* schedule planner: a calendar of your players with games per day, filled by count minus starting spots */
.cal th.d { text-align: center; }
.cal td.day { min-width: 48px; padding: 3px 2px; }
.cal td.lbl { white-space: nowrap; }
.cal tbody tr:hover { background: none; }
.daybtn { position: relative; width: 100%; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; padding: 4px 0; border-radius: 4px; display: flex; flex-direction: column; align-items: center; }
.daybtn b { font-size: 15px; font-weight: 650; line-height: 1.2; }
.daybtn small { font-size: 11px; color: var(--muted); }
.daybtn:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
.daybtn[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
tr.cmp-group td, tr.cmp-group:hover td { background: var(--panel-2); color: var(--muted); font-size: 12px; font-weight: 600; padding: 6px 10px; }
.verdict { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.big { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.pill { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-weight: 650; font-size: 12.5px; text-transform: capitalize; }
.pill.accept { background: color-mix(in oklch, var(--pos) 20%, transparent); color: var(--pos-ink); }
.pill.decline { background: color-mix(in oklch, var(--neg) 18%, transparent); color: var(--neg-ink); }
.pill.toss-up { background: var(--line); color: var(--muted); }
.side-by { display: flex; flex-wrap: wrap; gap: 10px 24px; margin: 0; }
.side-by dt { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.side-by dd { margin: 0; font-weight: 650; font-size: 16px; white-space: nowrap; }
.pill { white-space: nowrap; }
.seg { display: inline-flex; max-width: 100%; border: 1px solid var(--line-strong); border-radius: 6px; overflow-x: auto; }
.seg button { border: 0; background: var(--panel); padding: 6px 12px; cursor: pointer; font-weight: 550; color: var(--muted); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.seg.sm { flex: none; }  /* the top bar's Aim for (M30): chip-sized, beside the punt chips */
.seg.sm button { padding: 2px 9px; font-size: 12px; }
.punts .gap { width: 10px; flex: none; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* chat */
.chat { display: grid; grid-template-rows: 1fr auto; height: calc(100vh - 170px); min-height: 420px; }
.hist { display: flex; flex-direction: column; height: calc(100vh - 170px); min-height: 420px; }
.hist-list { overflow: auto; }
.hist-list button { display: flex; flex-direction: column; gap: 1px; width: 100%; min-width: 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; padding: 8px 14px; cursor: pointer; transition: background .12s; }
.hist-list button:hover { background: var(--panel-2); }
.hist-list button[aria-current="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.hist-list button:disabled { cursor: not-allowed; }
.hist-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
.msgs { overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 76ch; white-space: pre-wrap; line-height: 1.55; }
.msg.user { align-self: flex-end; background: var(--accent-soft); color: var(--accent-ink); padding: 8px 13px; border-radius: 12px 12px 4px 12px; }
.msg.ai { align-self: flex-start; }
.msg.ai.thinking { color: var(--muted); }
.compose { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.compose form { display: flex; gap: 8px; }
.compose textarea { flex: 1; resize: none; field-sizing: content; border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 12px; background: var(--panel); min-height: 42px; max-height: 160px; }
.compose textarea::placeholder { color: var(--faint); }
.sugs { display: flex; gap: 6px; flex-wrap: wrap; }

/* states */
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--text); margin-bottom: 4px; }
.skel { height: 14px; border-radius: 4px; background: var(--line); margin: 12px 16px; animation: pulse 1.2s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: .45; } to { opacity: 1; } }
.err { padding: 14px 16px; color: var(--neg-ink); }
/* Q31: This week's Today panel: both lineups side by side, a hairline between; the to-do list before tip */
.tonight { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
.tonight > .tw + .tw { border-left: 1px solid var(--line); }
.tonight td.line { white-space: normal; min-width: 150px; font-size: 12.5px; }
.todo { margin: 0; padding: 0 0 0 18px; display: grid; gap: 4px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); z-index: 20; }

@media (max-width: 980px) {
  .grid2 { grid-template-columns: 1fr; }
  .tonight { grid-template-columns: 1fr; }
  .tonight > .tw + .tw { border-left: 0; border-top: 1px solid var(--line); }
  .cats { grid-template-columns: repeat(5, 1fr); }
  .cat:nth-child(5) { border-right: 0; }
}
@media (max-width: 760px) {  /* the calendar fits 390px: no per-day note (colour and the day line keep it), tight cells */
  .cal th, .cal td { padding-left: 3px; padding-right: 3px; }
  .cal th { font-size: 11px; }
  .cal td.day { min-width: 0; padding: 3px 1px; }
  .cal td.lbl { white-space: normal; min-width: 64px; font-size: 12px; }
  .daybtn small { display: none; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand, .side-foot, table.race .proj { display: none; }
  .league .m-only { display: inline; }  /* the sidebar's sync line (Yahoo synced 5 min ago) moves under the league name */
  .app { align-content: start; }  /* the tab row keeps its height while a view loads */
  .nav span { white-space: nowrap; }
  .nav-sep { width: 1px; height: auto; margin: 6px 2px; }
  .top, .content { padding-left: 16px; padding-right: 16px; }
  .punts { margin-left: 0; width: 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }  /* one row that scrolls sideways */
  .punts .chip { flex: none; }
  .top-find { flex: 1 1 140px; width: auto; }
  #refresh { order: 1; }  /* beside the search, not on a row of its own */
  .punts { order: 2; }
  .grid2[style] { grid-template-columns: 1fr !important; }
  .chat { height: calc(100vh - 120px); }
  .hist { height: auto; min-height: 0; max-height: 210px; }
  .cats { grid-template-columns: repeat(3, 1fr); }
  .pcard .sep { border-left: 0; padding-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("gm." + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("gm." + k, JSON.stringify(v)); } catch {} },
};
const [hashView, hashQuery] = location.hash.slice(1).split("?");
const link = new URLSearchParams(hashQuery);
// Q36: the views in nav order (keys 1–9, 0); a #name that isn't one lands on This week. #strategy is new (it was a
// panel at the foot of My team); every older #name still opens its view
const VIEWS = ["week", "team", "strategy", "trades", "waivers", "movers", "compare", "schedule", "league", "gm"];
const ALIAS = { today: "week", punt: "strategy", plan: "strategy", hot: "movers", cold: "movers", chat: "gm" };
const toView = h => VIEWS.includes(h) ? h : ALIAS[h] || "week";  // #trades?give=A,B&get=C opens and evaluates a trade
// Trades' finder settings as they start (Reset puts them back); Count my / their waiver moves are remembered in this browser
// M30: Aim for the regular season (win %, the default) or the title, one app-wide choice like the punt; ?aim=title bookmarks it
const AIM = (a => ["season", "title"].includes(a) ? a : null)(new URLSearchParams(location.search).get("aim"));
const FIND0 = (aim = "season") => ({ tier: "fair", goal: aim === "title" ? "title" : "win", cats: [], vs: "", size: 3, healthy: false, mine: true, theirs: false, shape: "", overpay: "", outside: "", team: "", list: null, busy: false, ran: "", sort: null });
const S = {
  view: toView(hashView),  // Nov 24: no hash opens on This week (#team etc. still deep-link)
  scroll: {},  // Q36: each view's scroll position, put back when you return to it
  punt: new URLSearchParams(location.search).get("punt")?.split(",").filter(Boolean) ?? store.get("punt", []),  // ?punt=FT%25,TOV bookmarks a build
  aim: AIM ?? (store.get("aim", "season") === "title" ? "title" : "season"),  // M30: Aim for (Season / Title), kept in this browser
  healthyFa: store.get("healthyFa", false),  // Waivers' Healthy only: injured free agents off waivers, trades' free moves too
  state: null, error: null,
  league: { team: null, data: null, period: "", ahead: {} },  // period: "" rest of season, else "week:n" (weeks from this one : how many); ahead: {period: /api/ahead's answer}
  week: {},  // { data, loading }; replaced on punt / team / refresh, so late answers land in the old object
  sched: {},  // { data, loading }: the schedule planner; replaced on punt / team / refresh
  plan: { sort: null, open: false, day: null },  // its NBA-teams table: sort, count only your open days; the picked day
  news: {},  // { data, error }: My team's News panel; replaced on team / refresh
  strategy: {},  // { data, busy, sel }: the punt planner (sel: the build whose plan shows), ignores your punt, so only team / refresh / Healthy only replace it
  trade: { give: new Set(), get: new Set(), team: null, roster: null, result: null, busy: false },
  pool: store.get("pool", null),  // B21: who This week's streams may drop, your pick (null: the model's 3), kept in this browser
  skip: store.get("skip", []),  // free agents This week's streams and plan leave out (taken, or not wanted), kept in this browser
  // Nov 24: This week's one Play for control (Lean on and Start / sit's Play for merged): the categories picked, and
  // whether to lean on them (×2 in lineups, streams and the plan) or play for only them. Kept in this browser; the old
  // Lean on's {PTS: 2} carries over as a lean
  focus: store.get("weekFocus", null) ?? { cats: Object.keys(store.get("lean", {})), only: false },
  weekMore: false,  // Streaming adds' More paths unfolded
  locks: new Set(store.get("locks", [])),  // players the finder never trades, kept in this browser; Trades' Reset clears them
  find: { ...FIND0(AIM ?? store.get("aim", "season")), mine: store.get("mine", true), theirs: store.get("theirs", false) },
  improve: { kind: null, list: null, busy: false, sort: null },
  saved: { list: store.get("saved", []), evals: {}, loading: false },
  players: null,
  card: {},  // { name, t, data, error }: the open player card, under that name in the t-th player table of the view
  recap: {},  // { data, loading, error }: Q33's last week and season so far (/api/recap); replaced on every state load
  drops: {},  // { data, loading, error }: Who to drop (Q29, /api/drops), loaded with a roster alert; replaced on punt / team / refresh
  move: { add: "", drop: "", day: "", result: null, busy: false },  // Waivers' add/drop evaluator (Q7); result is dropped on punt / team / refresh
  wv: { pos: store.get("wvPos", ""), q: "", sort: store.get("wvSort", ""), goal: store.get("wvGoal", []), data: null, for: null },  // Q32: Waivers' filters, sort and Play for (data: /api/waivers for the goal, on S.state `for`)
  compare: { names: store.get("compare", []), line: "ros" },  // + data, busy, error; data is dropped on punt / team / refresh
  pool: null,  // every rostered player and free agent, for Compare's search
  offers: null,  // Trades' Offers sent (data/offers.json), loaded on first view
  chat: store.get("chat", []), chatBusy: false, gmDraft: "", chatSession: store.get("chatSession", null),
  chatId: store.get("chatId", null), chats: null,  // the open conversation's id in data/chats.json, and the History list
  gmSet: { model: "claude-opus-5-5", effort: "medium", web: true, ...store.get("gmSet", {}) },  // AI GM tab's Model / Effort / Web search
};
const OUT = new Set(["O", "INJ", "IL", "IL+", "NA", "SUSP"]);

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, punt: S.punt, healthy_fa: S.healthyFa, aim: aimTitle() ? "title" : "season" }) } : undefined);
  const data = await r.json().catch(() => ({ error: `Server returned ${r.status}` }));
  if (!r.ok || data.error) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), 3200);
}
function reveal(sel) {  // scroll to a panel (a selector or the element), clear of the sticky top bar (taller on phones)
  const el = typeof sel === "string" ? $(sel) : sel;
  if (el) window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - $(".top").offsetHeight - 12, behavior: "smooth" });
}

const stateUrl = () => "/api/state?punt=" + encodeURIComponent(S.punt.join(",")) + (S.healthyFa ? "&healthy_fa=1" : "") + (S.aim === "title" ? "&aim=title" : "");
async function loadState() {
  S.drops = {}; S.recap = {};
  try {
    S.state = await api(stateUrl());
    S.error = null; S.loaded = Date.now();
  } catch (e) { S.error = e.message; }
  render();
}

// ---------- formatting ----------
const isPoints = () => S.state?.mode === "points";
const oneWin = () => S.state?.scoring === "one_win";
// 9-cat's headline number: share of categories won (categories leagues, where each one counts in the standings) or the chance to win the week
const WIN = () => oneWin() ? { h: "Win odds", of: "weekly win odds", def: "chance to win a typical week vs the league" }
  : { h: "Win %", of: "win %", def: "share of categories you'd win in a typical week vs the league, the way the standings count them" };
const cap = s => s[0].toUpperCase() + s.slice(1);
const sign = v => (v > 0 ? "+" : "") + Number(v).toFixed(2);
const sign1 = v => (v > 0 ? "+" : "") + Number(v).toFixed(1);
const pct = v => Math.round(v * 100) + "%";
const chance = v => v > 0 && v < 0.005 ? "<1%" : v < 1 && v > 0.995 ? ">99%" : pct(v);  // never round a long shot to 0% or a lock to 100%
const delta = (v, unit) => unit === "win%" ? sign1(v) + "%" : sign(v);  // win% deltas are percentage points
const and = xs => xs.length > 1 ? xs.slice(0, -1).join(", ") + " and " + xs.at(-1) : xs.join("");
// waiver moves that need no trade (trades are scored on top of them): "Vučević for Achiuwa (+1.2%)"
// Q21: a name in a deal, a waiver move, This week's plan or a strategy step opens his card (under his table row if he
// has one on screen, else at the top: showCard). An inline span, not a <button>: a line can break after a button's box,
// which left a list's comma at the start of the next line (Nov 4); Enter / Space click it like a button
const nameBtn = n => !n ? "" : `<span class="rowbtn nm" role="button" tabindex="0" data-act="show-card" data-name="${esc(n)}" title="Open his player card">${esc(n)}</span>`;
// an add with no drop: into your open spot, or the one freed by moving your player who's out to an IL slot (Nov 20: parks)
const freed = w => w.parks?.length ? `nobody: ${and(w.parks.map(esc))} to IL` : "nobody: open spot";
// B18: an add into your open spot (drop null): who goes once your player in an IL slot is back
const thenBack = t => (t || []).map(x => x.parked ? `${esc(x.back)} stays in his IL slot this week` : `When ${esc(x.back)} is back ${esc(dayName(x.day))}, ${esc(x.cut)} is the one to drop for him`).join(". ");
const into = (m, nm = esc) => m.drop ? "for " + nm(m.drop) : m.park ? "into an IL slot" : "into the open spot";  // B5: an injured add parks
const freeList = (ms, more = 0, nm = esc) => and([...ms.map(m => `${nm(m.add)} ${into(m, nm)} (${delta(m.gain, "win%")})`),
  ...(more > 0 ? [`${more} more`] : [])]);
const ord = n => n + (n % 10 === 1 && n % 100 !== 11 ? "st" : n % 10 === 2 && n % 100 !== 12 ? "nd" : n % 10 === 3 && n % 100 !== 13 ? "rd" : "th");
const when = iso => new Date(iso).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const stop = s => s.replace(/\.?$/, ".");  // end a sentence on when(): some locales already end it "p.m."
const howOld = iso => { const m = (Date.now() - new Date(iso)) / 6e4;  // "5 min", "13h", "3d"
  return m < 1 ? "now" : m < 60 ? Math.floor(m) + " min" : m < 2880 ? Math.floor(m / 60) + "h" : Math.floor(m / 1440) + "d"; };
const ago = iso => howOld(iso) === "now" ? "just now" : howOld(iso) + " ago";
// a cache's state now (model.freshness(): ok / stale / failed / missing); "stale" also once the app has sat past its window
const freshness = x => x.status === "ok" && (Date.now() - new Date(x.fetched)) / 36e5 > x.hours ? "stale" : x.status;
const every = x => (x.hours < 1 ? `${x.hours * 60} minutes` : `${x.hours} hours`) + (x.key === "live" ? ", every 5 while a game is on" : "");
const freshTitle = x => ({ missing: `${x.label}: couldn't be fetched, so the model runs without ${x.lost}.`,
  failed: `${x.label}: the last refresh failed${x.error ? ` (${x.error})` : ""}, so this is the copy fetched ${stop(when(x.fetched))}`,
  stale: `${x.label}: fetched ${when(x.fetched)}, past its refresh (every ${every(x)}). Press Refresh to update it.`,
  ok: `${x.label}: fetched ${stop(when(x.fetched))} Refreshes every ${every(x)}.` })[freshness(x)];
const oddsColor = v => v > 0.6 ? "var(--pos)" : v < 0.35 ? "var(--neg)" : "var(--faint)";  // fills (dots, bars)
const oddsInk = v => v > 0.6 ? "var(--pos-ink)" : v < 0.35 ? "var(--neg-ink)" : "var(--muted)";  // the same scale as text (4.5:1)
// the instant tip (DESIGN.md): a label with a dotted underline whose explanation shows under it at once on hover, tap or
// focus. t is plain text; it lands in #tip, positioned fixed so a table that scrolls sideways never clips it
const tip = (h, t) => `<span data-tip="${esc(t)}" tabindex="0">${h}</span>`;
const tone = v => v > 0.05 ? "pos" : v < -0.05 ? "neg" : "";
// with a punt on, trade, waiver and Compare scoring count the punted categories as lost (Q13); My team's header and
// Standings movers show real odds, so those numbers carry this label
const lostTip = () => !isPoints() && S.punt.length ? `Counts ${and(S.punt.map(lab))} as lost every week, so moves are rated on the categories you play for. My team and Standings movers show your real odds.` : "";
const asLost = (sep = "· ") => lostTip() ? ` <span class="muted small" title="${lostTip()}">${sep}${and(S.punt.map(lab))} counted as lost</span>` : "";
function heat(v) {
  const a = Math.min(Math.abs(v) / 2.5, 1) * 0.5;
  const c = v >= 0 ? "var(--pos)" : "var(--neg)";
  return `color-mix(in oklch, ${c} ${Math.round(a * 100)}%, transparent)`;
}
const punted = c => S.punt.includes(c);

async function openCard(name, t, again) {  // again: the open card reloaded (What if), not closed

  if (S.card === C) render();

  const X = i => pad + i * (W - 2 * pad) / (p.length - 1), Y = v => H - pad - (v - lo) / sp * (H - 2 * pad);
  const d = p.map((x, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(x.v).toFixed(1)}`).join("");
  const read = p.map(x => `${mdy(x.day)}: ${fmt(x.v)}`), now = fmt(p[p.length - 1].v);
  return `<div class="trend" title="${esc(tip)}"><span class="trend-l">${label}</span>
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" data-read="${esc(JSON.stringify(read))}" aria-label="${esc(label)} at each pull from Yahoo: ${esc(read.join(", "))}">
      <line class="xh" x1="0" x2="0" y1="0" y2="${H}"/><path d="${d}"/><circle cx="${X(p.length - 1)}" cy="${Y(p[p.length - 1].v)}" r="4"/></svg>
    <span class="trend-v" data-now="${esc(now)}">${now}</span></div>`;
}

// Q8: the offer and a short pitch for Yahoo's trade note. It only claims what the numbers back: categories where

const WORD = { "FG%": "field-goal %", "FT%": "free-throw %", FG3M: "threes", PTS: "scoring", REB: "rebounds", AST: "assists", STL: "steals", BLK: "blocks", TOV: "ball security" };

  const names = ps => and(ps.map(p => p.name)), words = cs => and(cs.map(c => WORD[c] || c));
  const out = [`Trade idea: my ${names(r.give)} for your ${names(r.get)}.`];

    const up = Object.entries(r.cats_detail).map(([c, d]) => [c, d.them.odds[1] - d.them.odds[0]]).filter(([, g]) => g >= 3)
      .sort((a, b) => b[1] - a[1]).slice(0, 2).map(([c]) => c);
    const weak = up.filter(c => r.their_build.includes(c)), more = up.filter(c => !weak.includes(c));
    if (weak.length) out.push(`It shores up your ${words(weak)}${more.length ? ` and adds ${words(more)}` : ""}.`);
    else if (more.length) out.push(`It adds ${words(more)} for you.`);
  }
  if (r.market?.diff_pct <= -5) {  // a package counts less than its sum (PACKAGE), so when they send more players the
    // plain sum of Yahoo's ranks can favour them: say what holds either way, they get the deal's best player
    const best = [...r.give, ...r.get].reduce((a, b) => (b.mkt > a.mkt ? b : a));
    out.push(r.get.length > r.give.length && r.give.includes(best) ? `You'd get the best player in the deal, ${best.name}.`

  }
  const n = r.get.length - r.give.length;
  if (n > 0) out.push(`You also free up ${n > 1 ? n + " roster spots" : "a roster spot"} for the waiver wire.`);

  if (e.target.id === "wv-q") {  // Waivers' name search: draw the table again, keep the cursor in the box
    S.wv.q = e.target.value; const at = e.target.selectionStart; render();
    const i = $("#wv-q"); if (i) { i.focus(); i.setSelectionRange(at, at); }
  }  // kept across re-renders (history loading, Ask AI GM)
  if (e.target.id === "mv-add" && !/^(insertText|insertCompositionText|delete)/.test(e.inputType || "")) pickMove(e.target.value, true);  // a pick or a paste, not typing
  // the top bar opens a card as soon as a name is picked or pasted, not while one is typed ("Player 1" on the way to "Player 15")
  if (e.target.id === "top-player" && !/^(insertText|insertCompositionText|delete)/.test(e.inputType || "")) pickGlobal(e.target.value, true);
});
document.addEventListener("focusin", e => { if (e.target.id === "top-player" && !S.pool && S.state) loadPool(); });
document.addEventListener("submit", e => {
  if (e.target.id !== "chat-form") return;
  e.preventDefault(); const i = $("#chat-in"); const text = i.value; i.value = S.gmDraft = ""; ask(text);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey && !e.target.closest("input, textarea, select, [contenteditable]")) { e.preventDefault(); $("#top-player").focus(); }
  // Q36: 1–9 and 0 open the views in nav order, outside text fields
  if (/^[0-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey && !e.target.closest("input, textarea, select, [contenteditable]")) { e.preventDefault(); return setView(VIEWS[(+e.key + 9) % 10]); }
  if (e.target.id === "chat-in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#chat-form").requestSubmit(); }
  if (e.target.matches("span[role=button]") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.target.click(); }  // nameBtn
});
// new numbers in S.state (Refresh, or the server's own injury refetch): drop every view's cached answers
const fresh = st => { S.state = st; S.drops = {}; S.recap = {}; S.league.data = null; S.league.ahead = {}; S.trade.roster = null; S.find.list = S.find.ask = null; S.saved.evals = {}; S.players = null; S.week = {}; S.sched = {}; S.news = {}; S.strategy = {}; S.card = {}; S.pool = null; setCompare(S.compare.names); S.move.result = S.move.ask = null; S.loaded = Date.now(); };
$("#refresh").addEventListener("click", async e => {
  const b = e.currentTarget; b.classList.add("busy"); b.disabled = true;
  try {
    fresh(await api("/api/refresh", {}));
    toast("League refreshed");
  } catch (err) { toast("Refresh failed: " + err.message); }
  b.classList.remove("busy"); b.disabled = false; render();
});
// back on the tab after 10+ minutes: the server refetches ESPN's injuries every 30, so pull its numbers again
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !S.state || Date.now() - (S.loaded || 0) < 10 * 60e3) return;
  try {
    fresh(await api(stateUrl()));
    render();
  } catch (e) { /* offline or restarting: keep what's on screen */ }
});
// a new Yahoo pull, or a what-if or plan pick from the AI GM chat (the server looks every 15 seconds): take its numbers
setInterval(async () => {
  if (document.visibilityState !== "visible" || !S.state || $("#refresh").disabled) return;
  try {
    const now = await api("/api/stamp"), snap = now.fetched !== S.state.fetched;
    const mv = JSON.stringify(now.moves || []) !== JSON.stringify((S.state.moves || []).map(m => m.id));
    if (!snap && !mv && JSON.stringify(now.what || []) === JSON.stringify(S.state.what || [])) return;
    fresh(await api(stateUrl()));
    S.loaded = Date.now(); render(); toast(snap ? "League updated" : mv ? "Plan pick changed" : "What if changed");
  } catch (e) { /* offline or restarting: keep what's on screen */ }
}, 20e3);
// games under way (M18): the server rebuilds on live scores every 5 minutes, so This week follows them while it's in view
setInterval(async () => {
  const nx = S.week.data?.night?.lock?.next;  // Q31: also once the next game is past its tip, so its players lock
  if (document.visibilityState !== "visible" || S.view !== "week" || !(S.week.data?.tonight?.on || nx && Date.now() > Date.parse(nx.tip))) return;
  try {
    const st = await api(stateUrl());
    const { day, days } = S.week;  // B7: the day picked in Start / sit and the day table stay (Play for is in S.focus)
    const w = await api("/api/week", weekBody());
    fresh(st); S.week = { data: w, day, days }; render();
  } catch (e) { /* offline or restarting: keep what's on screen */ }
}, 5 * 60e3);
// a table that scrolls sideways fades on the side with more to see (CSS .more-l / .more-r)
function edge(t) {
  t.classList.toggle("more-l", t.scrollLeft > 2);
  t.classList.toggle("more-r", t.scrollLeft + t.clientWidth < t.scrollWidth - 2);
}
addEventListener("scroll", e => e.target.classList?.contains("tw") && edge(e.target), { capture: true, passive: true });
addEventListener("resize", () => document.querySelectorAll("#view .tw").forEach(edge));
// the instant tip: one element for every [data-tip], under the label (above it near the bottom of the window)
const tipEl = Object.assign(document.createElement("div"), { id: "tip", hidden: true }); tipEl.setAttribute("role", "tooltip"); document.body.append(tipEl);
let tipAt = null;  // the label the tip is under: a scroll moves the tip with it
function showTip(el) {
  tipAt = el?.isConnected ? el : null;
  if (!tipAt) { tipEl.hidden = true; return; }
  tipEl.textContent = el.dataset.tip; tipEl.hidden = false; el.setAttribute("aria-describedby", "tip");
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left - 6)) + "px";
  tipEl.style.top = (r.bottom + 6 + h > innerHeight && r.top - 6 - h > 0 ? r.top - 6 - h : r.bottom + 6) + "px";
}
document.addEventListener("pointerover", e => showTip(e.target.closest?.("[data-tip]")));
document.addEventListener("focusin", e => { if (e.target.dataset?.tip) showTip(e.target); });
document.addEventListener("focusout", () => showTip(null));
addEventListener("scroll", () => tipAt && showTip(tipAt), { capture: true, passive: true });
render(); navInView();
if (S.view === "compare" && link.has("players")) setCompare(link.get("players").split(",").filter(Boolean));
loadState().then(() => {
  if (S.state && S.view === "waivers" && (link.has("add") || link.has("drop"))) { Object.assign(S.move, { add: link.get("add"), drop: link.get("drop") || "", day: link.get("day") || "" }); return evalMove(); }
  if (!S.state || S.view !== "trades" || !(link.has("give") || link.has("get"))) return;
  const names = k => (link.get(k) || "").split(",").filter(Boolean);
  Object.assign(S.trade, { give: new Set(names("give")), get: new Set(names("get")) });
  evaluate();
});
</script>
